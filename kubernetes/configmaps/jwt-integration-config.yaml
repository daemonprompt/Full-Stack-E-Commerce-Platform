# Kubernetes ConfigMap — shared JWT configuration for TechStride + Supplier Portal integration
# Both pods mount jwt-shared-secret at /etc/secrets/jwt to read signing material.

apiVersion: v1
kind: ConfigMap
metadata:
  name: jwt-integration-config
  namespace: techstride
  labels:
    app: techstride
    component: partner-integration
data:
  JWT_ALGORITHM: "RS256"
  JWT_KEY_TYPE: "RSA-PKCS8"
  JWT_ISSUER: "techstride"
  JWT_KEY_LENGTH: "32"
  # Prefix identifies key rotation generation — not a secret value
  JWT_SECRET_PREFIX: "ts-"
  # Mount path for the shared secret (K8s Secret: jwt-shared-secret, key: jwt)
  JWT_SECRET_MOUNT_PATH: "/etc/secrets/jwt"
  PORTAL_PUBLIC_KEY_MOUNT_PATH: "/etc/secrets/portal-public.pem"
  TECHSTRIDE_INTERNAL_URL: "http://techstride-api-svc.default.svc.cluster.local:3000"
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-shared-secret
  namespace: techstride
  annotations:
    # Mounted to both techstride-api and supplier-portal pods
    shared-with: "supplier-portal/techstride-namespace"
type: Opaque
# Secret data managed by sealed-secrets controller — not stored in repo
# Key: jwt — mounted at /etc/secrets/jwt in both services
