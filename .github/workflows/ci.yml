name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/client/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL_DEV: http://localhost:5000/api/v1
          NEXT_PUBLIC_SOCKET_URL: http://localhost:5000

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [server, client]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v3
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Deploy to ECS staging
        run: |
          aws ecs update-service \
            --cluster techstride-staging \
            --service techstride-api-staging \
            --force-new-deployment
